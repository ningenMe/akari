version: 0.0
os: linux
files:
  - source: /
    destination: /opt/akari-front

hooks:
  BeforeInstall:
    - location: scripts/before_install.sh
      timeout: 60
  AfterInstall:
    - location: scripts/after_install.sh
      timeout: 180
  ApplicationStart:
    - location: scripts/application_start.sh
      timeout: 60
  ValidateService:
    - location: scripts/validate_service.sh
      timeout: 60
